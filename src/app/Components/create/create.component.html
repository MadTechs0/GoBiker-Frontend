<div class="create d-flex flex-column gap-10 p-3 h-100 w-100">
  <button class="btn btn-primary rounded-pill fw-bold post-btn"(click)="createPost()">Post</button>
  <div class="d-flex align-items-center gap-10">
    <div class="text-color fs-6">post to:</div>
    <input type="text" (change)="searchCommunity(communityName)" [(ngModel)]= "communityName" class="communitiy-input bg-color-secondary fs-6 p-2 rounded" placeholder="click to search communities">
  </div>
  <div class="communities d-flex flex-column option-gap">
    <div class="d-flex gap-10" *ngFor="let community of communities" (click)="post.communityId = community._id">
      <div class="community-img rounded-circle"></div> 
      <div class="d-flex flex-column gap-10">
          <div class="fw-bold fs-6">
              {{community.name}}
          </div>
          <div class="text-color">{{community.members}} members</div>
      </div>
    </div>
  </div>
  <input
    type="text"
    class="bg-color-primary fs-1 fw-bold w-100"
    placeholder="Title"
    [(ngModel)]="post.title"
  />
  <ngx-editor
    [editor]="editor"
    [(ngModel)]="post.description"
    class="fs-5 w-100 bg-color-primary"
    [placeholder]="'Add post description...'"
  ></ngx-editor>
  <div class="editor-options d-flex flex-wrap align-items-center w-100">
    <ngx-editor-menu [editor]="editor" [toolbar]="toolbar"> </ngx-editor-menu>
    <label for="image-input"><img src="assets/Icons/image.png" class="ps-1" alt=""></label>
    <input (input)="postImg" type="file" (change)="onFileSelected($event)" id="image-input">
  </div>
  <img [src]="postImg" class="rounded-4 w-100" alt="">
</div>
