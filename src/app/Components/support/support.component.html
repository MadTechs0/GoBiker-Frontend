<div class="support-page container py-5">
    <div class="text-center mb-5">
      <img src="assets/favicon-support.png" alt="Support Icon" width="80" class="mb-3">
      <h1 class="display-4 fw-bold mb-3">Support Center</h1>
      <p class="lead">We're here to help you 24/7</p>
    </div>
  
    <div class="row g-4">
      <div class="col-lg-6">
        <div class="card border-0 shadow rounded-4 h-100">
          <div class="card-body p-4">
            <h2 class="fw-bold mb-4"><i class="bi bi-headset me-2"></i>Contact Us</h2>
            <form (ngSubmit)="submitTicket()">
              <div class="mb-3">
                <label class="form-label">Your Email</label>
                <input type="email" class="form-control" [(ngModel)]="ticket.email" name="email" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Subject</label>
                <input type="text" class="form-control" [(ngModel)]="ticket.subject" name="subject" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Message</label>
                <textarea class="form-control" rows="5" [(ngModel)]="ticket.message" name="message" required></textarea>
              </div>
              <button type="submit" class="btn btn-primary w-100 py-2">
                <i class="bi bi-send me-2"></i>Submit Request
              </button>
            </form>
          </div>
        </div>
      </div>
  
      <div class="col-lg-6">
        <div class="card border-0 shadow rounded-4 h-100">
          <div class="card-body p-4">
            <h2 class="fw-bold mb-4"><i class="bi bi-question-circle me-2"></i>FAQs</h2>
            <div class="accordion" id="faqAccordion">
              <div class="accordion-item border-0 mb-2" *ngFor="let item of faqs; let i = index">
                <h3 class="accordion-header">
                  <button class="accordion-button collapsed rounded-3" type="button" 
                    data-bs-toggle="collapse" [attr.data-bs-target]="'#faqCollapse' + i">
                    {{item.question}}
                  </button>
                </h3>
                <div [id]="'faqCollapse' + i" class="accordion-collapse collapse" 
                  data-bs-parent="#faqAccordion">
                  <div class="accordion-body">
                    {{item.answer}}
                  </div>
                </div>
              </div>
            </div>
  
            <div class="mt-4 pt-3 border-top">
              <h3 class="fw-bold mb-3"><i class="bi bi-chat-dots me-2"></i>Live Chat</h3>
              <button class="btn btn-outline-primary w-100 py-2">
                <i class="bi bi-headset me-2"></i>Start Live Chat
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
