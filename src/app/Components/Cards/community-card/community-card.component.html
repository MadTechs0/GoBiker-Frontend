<div class="community d-flex flex-column gap-10 border p-2 rounded-4 w-100" [routerLink]="'/communities/' + community._id">
    <div class="d-flex justify-content-between align-items-center">
        <div class="d-flex gap-10">
            <img class="community-img rounded-circle" [src]="community.avatarUrl"> 
            <div class="d-flex flex-column gap-10">
                <div class="fw-bold fs-6">
                    {{community.name}}
                </div>
                <div class="text-color">
                    {{community.members}} members
                </div>
            </div>
        </div>
        <div class="join-btn btn-primary btn ps-2 pe-2 pt-1 pb-1">
            Join
        </div>
    </div>    
    <div class="description text-color text-wrap">
        {{community.description}}
    </div>    
</div>
