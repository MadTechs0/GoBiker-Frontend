<div class="chat-box-container">
    <!-- Chat header -->
    <div class="chat-header d-flex align-items-center p-3 border-bottom">
      <div class="user-avatar me-3">
        <div class="avatar-circle bg-primary text-white d-flex align-items-center justify-content-center">
          {{currentUser?.name?.charAt(0) || 'U'}}
        </div>
      </div>
      <div class="user-info flex-grow-1">
        <h5 class="mb-0">{{currentUser?.name || 'User'}}</h5>
        <small class="text-muted" [class.text-success]="currentUser?.isOnline">
          {{currentUser?.isOnline ? 'Online' : 'Offline'}}
        </small>
      </div>
      <div class="chat-actions">
        <button class="btn btn-sm btn-outline-secondary">
          <i class="bi bi-telephone"></i>
        </button>
        <button class="btn btn-sm btn-outline-secondary ms-2">
          <i class="bi bi-three-dots-vertical"></i>
        </button>
      </div>
    </div>
  
    <!-- Messages area -->
    <div class="messages-container" #messagesContainer>
      <div *ngFor="let message of messages" class="message-wrapper" [class.sent]="message.sender === 'me'">
        <div class="message-bubble">
          <div class="message-content">{{message.text}}</div>
          <div class="message-time">{{message.time | date:'shortTime'}}</div>
        </div>
      </div>
    </div>
  
    <!-- Message input -->
    <div class="message-input-container p-3 border-top">
      <div class="d-flex align-items-center">
        <button class="btn btn-sm btn-outline-secondary me-2">
          <i class="bi bi-paperclip"></i>
        </button>
        <div class="flex-grow-1 position-relative">
          <input type="text" class="form-control" placeholder="Type a message..." 
                 [(ngModel)]="newMessage" (keyup.enter)="sendMessage()">
          <button class="btn btn-sm btn-link position-absolute end-0 top-50 translate-middle-y me-2">
            <i class="bi bi-emoji-smile"></i>
          </button>
        </div>
        <button class="btn btn-sm btn-primary ms-2" [disabled]="!newMessage" (click)="sendMessage()">
          <i class="bi bi-send"></i>
        </button>
      </div>
    </div>
  </div>
