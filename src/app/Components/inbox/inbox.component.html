<div class="inbox-container" [@slideAnimation]="activeIndex">
  <div class="d-flex justify-content-center w-100 fs-5 text-color fw-medium mb-3">
    <div class="text-center w-50 p-3">
      <span class="tab-header p-3" [class.active-bottom]="activeIndex === 0"
            (click)="setActiveTab(0)">
        Notifications
      </span>
    </div>
    <div class="text-center w-50 p-3">
      <span class="tab-header p-3" [class.active-bottom]="activeIndex === 1" 
            (click)="setActiveTab(1)">
        Chats
      </span>
    </div>
  </div>

  <div class="tab-content">
    <div *ngIf="activeIndex === 0" class="notification-list">
      <div *ngFor="let notification of notifications" class="notification-item d-flex align-items-center gap-3 p-3 bg-color-secondary ">
        <div class="notification-icon rounded-circle bg-primary text-white d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
          <i class="bi bi-bell-fill"></i>
        </div>
        <div class="notification-content">
          <div class="fw-medium">{{notification.title}}</div>
          <div class="text-muted small">{{notification.message}}</div>
          <div class="text-muted extra-small">{{notification.time}}</div>
        </div>
        <div *ngIf="!notification.read" class="ms-auto">
          <span class="badge bg-danger rounded-pill">New</span>
        </div>
      </div>
      
      <div *ngIf="notifications.length === 0" class="text-center py-5 text-muted">
        <i class="bi bi-bell-slash fs-1"></i>
        <p class="mt-2">No new notifications</p>
      </div>
    </div>

    <div *ngIf="activeIndex === 1" class="chat-list">
      <div *ngFor="let chat of chats" class="chat-item d-flex gap-3 align-items-center p-3 bg-color-secondary divider-bottom" routerLink="/chat">
        <div class="chat-img rounded-circle bg-info d-flex align-items-center justify-content-center text-white" style="width: 50px; height: 50px;">
          {{chat.name.charAt(0)}}
        </div>
        <div class="chat-info flex-grow-1">
          <div class="d-flex justify-content-between">
            <span class="fw-medium">{{chat.name}}</span>
            <span class="text-muted small">{{chat.lastMessageTime}}</span>
          </div>
          <div class="d-flex justify-content-between">
            <div class="text-truncate" style="max-width: 200px;">{{chat.lastMessage}}</div>
            <div *ngIf="chat.unreadCount > 0" class="ms-2">
              <span class="badge bg-primary rounded-pill">{{chat.unreadCount}}</span>
            </div>
          </div>
        </div>
      </div>
      
      <div *ngIf="chats.length === 0" class="text-center py-5 text-muted">
        <i class="bi bi-chat-left-text fs-1"></i>
        <p class="mt-2">No chats available</p>
      </div>
    </div>
  </div>
</div>
<router-outlet></router-outlet>
