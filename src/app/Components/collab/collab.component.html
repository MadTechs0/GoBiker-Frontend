<div class="collaboration-page container py-5">
    <div class="text-center mb-5">
      <img src="assets/favicon-collab.png" alt="Collaboration Icon" width="80" class="mb-3">
      <h1 class="display-4 fw-bold mb-3">Business Collaboration</h1>
      <p class="lead">Partner with us to create amazing opportunities</p>
    </div>
  
    <div class="row g-4 mb-5">
      <div class="col-md-4" *ngFor="let benefit of benefits">
        <div class="card border-0 shadow rounded-4 h-100 hover-card">
          <div class="card-body p-4 text-center">
            <div class="icon-wrapper bg-primary mb-3 mx-auto">
              <i class="bi text-white" [class]="benefit.icon"></i>
            </div>
            <h4 class="fw-bold">{{benefit.title}}</h4>
            <p class="text-muted">{{benefit.description}}</p>
          </div>
        </div>
      </div>
    </div>
  
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card border-0 shadow rounded-4">
          <div class="card-body p-5">
            <h2 class="fw-bold mb-4 text-center">Collaboration Request</h2>
            <form (ngSubmit)="submitRequest()">
              <div class="mb-4">
                <label class="form-label">Organization Name</label>
                <input type="text" class="form-control" [(ngModel)]="request.orgName" name="orgName" required>
              </div>
              <div class="mb-4">
                <label class="form-label">Contact Email</label>
                <input type="email" class="form-control" [(ngModel)]="request.email" name="email" required>
              </div>
              <div class="mb-4">
                <label class="form-label">Industry</label>
                <select class="form-select" [(ngModel)]="request.industry" name="industry" required>
                  <option *ngFor="let industry of industries" [value]="industry">{{industry}}</option>
                </select>
              </div>
              <div class="mb-4">
                <label class="form-label">Collaboration Proposal</label>
                <textarea class="form-control" rows="5" [(ngModel)]="request.proposal" name="proposal" required></textarea>
              </div>
              <div class="text-center">
                <button type="submit" class="btn btn-primary px-5 py-2">
                  <i class="bi bi-send me-2"></i>Submit Request
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
