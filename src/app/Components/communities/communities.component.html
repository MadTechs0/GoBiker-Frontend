<div *ngIf="showCards">
    <div class="d-flex flex-column option-gap container">
        <div class="search-communities d-flex align-items-center position-relative"><mat-icon class="position-absolute ms-1 action-icon">search</mat-icon><input type="text" class="fw-medium fs-6 rounded-pill text-color-dark form-input ps-5 w-100" placeholder="Search Communities"></div>
    <div class="community-option d-flex gap-10">
        <div class="icon-highlight option w-50 rounded-4 fw-bold container p-3" routerLink="create">
            <i class="fa-solid fa-plus"></i>
            <div>Create Community</div>
        </div>
        <div class="icon-highlight option w-50 rounded-4 fw-bold container p-3">
            <i class="fa-solid fa-user-group"></i>
            <div>Join Community</div>
        </div>
    </div>
    <div class="fw-medium fs-5">My Communities</div>
    <div class="communities">
        <app-community-card [community]="community" *ngFor="let community of myCommunities"></app-community-card>
    </div>
    <div class="fw-medium fs-5">Recommended</div>
    <div class="communities">
        <app-community-card [community]="community" *ngFor="let community of recommendations"></app-community-card>
        <app-community-card [community]="community" *ngFor="let community of recommendations"></app-community-card>
        <app-community-card [community]="community" *ngFor="let community of recommendations"></app-community-card>
    </div>
    <div class="fw-medium fs-5 d-flex align-items-center justify-content-between">Community Posts</div> 
    </div>
    <div class="community-posts d-flex flex-column">
        <app-post-card></app-post-card>
        <app-post-card></app-post-card>
        <app-post-card></app-post-card> 
    </div>
</div>  
<router-outlet></router-outlet>
