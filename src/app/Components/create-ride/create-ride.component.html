<div class="d-flex flex-column option-gap container">
    <i class="pi pi-arrow-left"></i>
    <label for="title" class="fs-6 fw-normal">Upload Image</label>
    <label for="ride-img" class="ride-img rounded-4 d-flex align-items-center gap-10 justify-content-center text-color">
        <mat-icon class="">cloud_upload</mat-icon>
        <div>Tap to upload image</div>
        <input type="file" id="ride-img">
    </label>  
    <form [formGroup]="rideForm" class="d-flex flex-column option-gap">
        <div class="d-flex align-items-center gap-10">
            <label for="intercity" class="fs-6 fw-medium">InterCity</label><img [ngClass]="rideForm.get('intercity')?.value? 'border-bottom border-2 border-primary' :''" src="assets/Icons/path.png" alt=""><input id="intercity" class="d-none" type="checkbox" formControlName="intercity" placeholder="Ex: City Night Ride">
        </div>
        <div class="d-flex flex-column gap-10">
            <label for="title" class="fs-6 fw-normal">Ride Title</label>
            <input type="text" formControlName="title" placeholder="Ex: City Night Ride" class="form-input p-2 text-color">
        </div>
        <div class="d-flex flex-column gap-10">
            <label class="fs-6 fw-normal">Starting Location</label>
            <app-location-picker
            placeholder="Enter start point"
            (locationSelected)="setStartLocation($event)">
          </app-location-picker>
        </div>
        <div class="d-flex flex-column gap-10">
            <label class="fs-6 fw-normal">Ending Location</label>
            <app-location-picker
            placeholder="Enter destination"
            (locationSelected)="setEndLocation($event)">
        </app-location-picker>
        </div>        
        <app-map 
        [start]="startLocation"
        [end]="endLocation">
        </app-map>
        <div class="d-flex flex-column gap-10">
            <label class="fs-6 fw-normal">Date & Time</label>
            <input type="datetime-local" formControlName="date" placeholder="Ex: Jaipur" class="form-input p-2">
        </div>
        <div class="d-flex flex-column gap-10">
            <label class="fs-6 fw-normal">Required Gears</label>
            <div class="d-flex option-gap w-100 flex-wrap">
                <label for="helmet" class="d-flex gap-10 border p-3 rounded"  [ngClass]="rideForm.get('helmet')?.value? 'border border-danger border-3' :''">
                    <input type="checkbox" formControlName="helmet"  class="d-none" id="helmet" name="helmet">
                    <div  class="d-flex gap-10 align-items-center"><img src="assets/Icons/helmet.png" alt="">Helmet</div>
                </label>
                <label class="d-flex gap-10 border p-3 rounded" for="gloves"  [ngClass]="rideForm.get('gloves')?.value? 'border border-danger border-3' :''">
                    <input  type="checkbox" formControlName="gloves" class="d-none" id="gloves" name="gloves">
                    <div class="d-flex gap-10 align-items-center"><img src="assets/Icons/gloves.png" alt="">Gloves</div>
                </label>
                <label class="d-flex gap-10 border p-3 rounded"  [ngClass]="rideForm.get('jacket')?.value? 'border border-danger border-3' :''">
                    <input type="checkbox" class="d-none" formControlName="jacket">
                    <div for=""  class="d-flex gap-10 align-items-center"><img src="assets/Icons/jacket.png" alt="">Jacket</div>
                </label>
            </div>
        </div> 
        <div class="d-flex flex-column gap-10">
            <label for="title" class="fs- 6 fw-normal">Notes</label>
            <textarea class="rounded-4 form-input p-2" formControlName="notes" rows="6"  placeholder="Add any additional notes for joining riders"></textarea>
        </div> 
    </form>   

    <button class="btn btn-primary">Publish Ride</button>
</div>
